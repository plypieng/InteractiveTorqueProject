version: '3.8'

services:
  redis:
    image: redis
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8050:8050"
    environment:
      - ALLOWED_DIRECTORY=/data
      - DATABASE_URL=sqlite:///torque_data.db
    volumes:
      - W:/:/data
      - ./app.log:/app/logs
    depends_on:
      - redis

  celery_worker:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      - ALLOWED_DIRECTORY=/data
      - DATABASE_URL=sqlite:///torque_data.db
    volumes:
      - W:/:/data
      - ./app.log:/app/logs
    depends_on:
      - redis
